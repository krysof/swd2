<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#100b08">
  <meta name="description" content="《轩辕剑2》可移植 C++ 重写版 WebAssembly 构建">
  <title>轩辕剑2 · SWD2</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      color: #eee4ce; background:
        radial-gradient(circle at 50% 15%, #49311f 0, #1c130e 42%, #080706 100%);
      overscroll-behavior: none;
    }
    main {
      width: min(100%, 1040px); padding: clamp(10px, 2vw, 24px); text-align: center;
      backface-visibility: hidden;
    }
    h1 { margin: 0 0 10px; font: 700 clamp(22px, 5vw, 38px)/1.1 Georgia, serif; letter-spacing: .12em; }
    .stage {
      /* The framebuffer is 320x200, but VGA Mode 13h was viewed on a 4:3 CRT.
         Displaying its square-byte ratio (8:5) makes the artwork look flat. */
      position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden;
      border: 2px solid #9a7140; border-radius: 8px; background: #000;
      box-shadow: 0 16px 55px #000b, inset 0 0 0 1px #e9c68355;
    }
    canvas {
      display: block; width: 100% !important; height: 100% !important;
      aspect-ratio: 4 / 3; outline: 0; image-rendering: pixelated;
    }
    #status-wrap {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 12px;
      padding: 24px; background: #090705; transition: opacity .3s; pointer-events: none;
    }
    #status-wrap.ready { opacity: 0; }
    #status { font-weight: 650; }
    progress { width: min(65vw, 420px); accent-color: #b8823e; }
    .toolbar { margin-top: 10px; }
    .hint { margin: 0; color: #cab995; text-align: center; font-size: 14px; }
    button {
      color: inherit; background: #2a1d13; border: 1px solid #876438; border-radius: 7px;
      min-width: 44px; min-height: 40px; padding: 8px 12px; font: inherit; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #8b632f; transform: translateY(1px); }
    .touch {
      display: flex; justify-content: center; align-items: center;
      gap: clamp(18px, 6vw, 64px); margin: 16px auto 0;
    }
    .dpad {
      display: grid; grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 44px); gap: 5px;
    }
    .dpad [data-key="ArrowUp"] { grid-column: 2; grid-row: 1; }
    .dpad [data-key="ArrowLeft"] { grid-column: 1; grid-row: 2; }
    .dpad [data-key="ArrowDown"] { grid-column: 2; grid-row: 2; }
    .dpad [data-key="ArrowRight"] { grid-column: 3; grid-row: 2; }
    .actions { display: flex; gap: 14px; }
    .actions button { min-width: 92px; font-weight: 800; }
    #error { min-height: 1.4em; margin: 8px 0 0; color: #ff9b8f; font-size: 13px; }
    #start-gate {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      padding: 24px; background: #080604ee; text-align: center;
    }
    #start-gate[hidden] { display: none; }
    .start-card {
      width: min(92vw, 430px); padding: 28px 22px; border: 2px solid #9a7140;
      border-radius: 12px; background: #1d130d;
      box-shadow: 0 20px 70px #000, inset 0 0 24px #9a714022;
    }
    .start-credit { margin: 0 0 9px; font-size: clamp(21px, 6vw, 30px); font-weight: 800; }
    .start-version { margin: 0 0 9px; color: #cab995; font-size: 14px; }
    .start-site { display: block; margin: 0 0 22px; color: #e8bd76; }
    #start-button { min-width: 230px; min-height: 52px; font-weight: 800; }
    @media (hover: none), (pointer: coarse) { .hint { font-size: 12px; } }
    @media (max-width: 520px) { main { align-self: start; } h1 { margin-top: 2px; } }
    @media (pointer: coarse) {
      body { overflow: hidden; }
      main {
        width: 100svw; height: 100svh; padding: 5px;
        display: grid; grid-template-columns: 154px minmax(0, 1fr) 206px;
        grid-template-rows: minmax(0, 1fr); gap: 8px; align-items: center;
      }
      h1, .toolbar, #error { display: none; }
      .stage {
        width: min(100%, calc((100svh - 10px) * 4 / 3));
        grid-column: 2; grid-row: 1; justify-self: center;
      }
      .touch { display: contents; }
      .dpad {
        grid-column: 1; grid-row: 1; justify-self: center; align-self: center;
      }
      .actions {
        grid-column: 3; grid-row: 1; justify-self: center; align-self: center;
        flex-direction: row; gap: 14px;
      }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      main {
        position: fixed; left: 50%; top: 50%;
        width: 100svh; height: 100svw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center;
      }
      .stage {
        width: min(100%, calc((100svw - 10px) * 4 / 3));
      }
    }
  </style>
</head>
<body>
  <div id="start-gate" role="dialog" aria-modal="true" aria-labelledby="start-credit">
    <div class="start-card">
      <p class="start-credit" id="start-credit">白河愁 破解移植</p>
      <p class="start-version" id="build-version">版本 __SWD2_RELEASE_VERSION__</p>
      <a class="start-site" href="http://www.ff18.com" target="_blank" rel="noopener noreferrer">http://www.ff18.com</a>
      <button id="start-button" type="button">点击开始并开启声音</button>
    </div>
  </div>
  <main data-mobile-layout="rotated-v4-crt">
    <h1>轩辕剑2</h1>
    <section class="stage" id="stage">
      <canvas id="canvas" tabindex="0" aria-label="SWD2 游戏画面" oncontextmenu="event.preventDefault()"></canvas>
      <div id="status-wrap">
        <div id="status">正在载入 WebAssembly…</div>
        <progress id="progress" max="100" value="0"></progress>
      </div>
    </section>
    <div class="toolbar">
      <p class="hint">键盘方向键移动 · Enter 确认 · Esc 取消 · 存档保存在当前浏览器</p>
    </div>
    <div class="touch" aria-label="触摸控制">
      <div class="dpad" aria-label="方向控制">
        <button data-key="ArrowUp" aria-label="上">▲</button>
        <button data-key="ArrowLeft" aria-label="左">◀</button>
        <button data-key="ArrowDown" aria-label="下">▼</button>
        <button data-key="ArrowRight" aria-label="右">▶</button>
      </div>
      <div class="actions">
        <button data-key="Escape" aria-label="取消">ESC</button>
        <button data-key="Enter" aria-label="确认">回车</button>
      </div>
    </div>
    <p id="error" role="alert"></p>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const statusWrap = document.getElementById('status-wrap');
    const statusText = document.getElementById('status');
    const progress = document.getElementById('progress');
    const errorText = document.getElementById('error');
    const startGate = document.getElementById('start-gate');
    const startButton = document.getElementById('start-button');
    const selfTestParameters = new URLSearchParams(location.search);
    const idbfsSelfTestToken = selfTestParameters.get('idbfs-self-test');
    const idbfsSelfTestReport = selfTestParameters.get('idbfs-report');
    const inputSelfTestEnabled =
      selfTestParameters.get('input-self-test') === '1';
    const idbfsSelfTestSessionKey = 'swd2-idbfs-self-test-token';
    const idbfsSelfTestPath = '/saves/.swd2-idbfs-restart-probe';
    let startRequested = Boolean(idbfsSelfTestToken);
    let startDependencyInstalled = false;
    let wakeLock = null;

    if (idbfsSelfTestToken) startGate.hidden = true;

    function releaseStartDependency() {
      if (!startRequested || !startDependencyInstalled) return;
      startDependencyInstalled = false;
      removeRunDependency('swd2-user-start');
    }

    function unlockWebAudio() {
      try {
        Module.SDL2 ||= {};
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!Module.SDL2.audioContext && AudioContextClass) {
          // Create the exact context later reused by Emscripten SDL while the
          // browser still considers this call part of the start-button gesture.
          Module.SDL2.audioContext = new AudioContextClass();
        }
        const context = Module.SDL2.audioContext;
        if (context && context.state !== 'running') {
          const resumed = context.resume();
          if (resumed && resumed.catch) resumed.catch(() => {});
        }
      } catch (_) {
        // A later game/control gesture gets another chance to resume audio.
      }
    }

    async function acquireWakeLock() {
      if (!startRequested || document.visibilityState !== 'visible' ||
          !navigator.wakeLock || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        document.documentElement.dataset.wakeLock = 'active';
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          document.documentElement.dataset.wakeLock = 'released';
        }, { once: true });
      } catch (_) {
        document.documentElement.dataset.wakeLock = 'unavailable';
      }
    }

    function requestLandscapeOrientation() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          const locked = screen.orientation.lock('landscape');
          if (locked && locked.catch) locked.catch(() => {});
        }
      } catch (_) {
        // CSS rotation remains the fallback on iOS and non-fullscreen browsers.
      }
    }

    function beginGame(event) {
      event.preventDefault();
      startRequested = true;
      document.documentElement.dataset.started = 'true';
      unlockWebAudio();
      void acquireWakeLock();
      requestLandscapeOrientation();
      startGate.hidden = true;
      releaseStartDependency();
      canvas.focus();
    }

    startButton.addEventListener('click', beginGame);
    document.addEventListener('pointerdown', unlockWebAudio, { capture: true });
    document.addEventListener('keydown', unlockWebAudio, { capture: true });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && startRequested) {
        unlockWebAudio();
        void acquireWakeLock();
      }
    });
    window.addEventListener('pageshow', () => {
      if (startRequested) void acquireWakeLock();
    });

    function finishIdbfsSelfTest(passed, message) {
      document.documentElement.dataset.idbfsSelfTest = passed ? 'pass' : 'fail';
      statusText.textContent = message;
      progress.hidden = true;
      errorText.textContent = passed ? '' : message;
      // A same-origin local runner can receive the result from branded
      // browsers that intentionally disallow WebDriver/Apple Events. The
      // callback exists only for an explicit nonce-bearing self-test URL and
      // carries no save bytes or browsing data.
      if (idbfsSelfTestReport) {
        fetch('/__swd2_idbfs_result', {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nonce: idbfsSelfTestReport,
            passed,
            message,
            userAgent: navigator.userAgent,
            platform: navigator.platform || ''
          })
        }).catch(() => {});
      }
    }

    function runIdbfsSelfTest() {
      const payload = `SWD2-IDBFS:${idbfsSelfTestToken}`;
      const restoredToken = sessionStorage.getItem(idbfsSelfTestSessionKey);
      if (restoredToken !== idbfsSelfTestToken) {
        try {
          FS.writeFile(idbfsSelfTestPath, payload);
        } catch (error) {
          finishIdbfsSelfTest(false, `IDBFS 测试写入失败：${error}`);
          return;
        }
        FS.syncfs(false, function(error) {
          if (error) {
            finishIdbfsSelfTest(false, `IDBFS 测试提交失败：${error}`);
            return;
          }
          sessionStorage.setItem(idbfsSelfTestSessionKey, idbfsSelfTestToken);
          location.reload();
        });
        return;
      }

      let restored = '';
      try {
        restored = FS.readFile(idbfsSelfTestPath, { encoding: 'utf8' });
      } catch (error) {
        finishIdbfsSelfTest(false, `IDBFS 重启读取失败：${error}`);
        return;
      }
      if (restored !== payload) {
        finishIdbfsSelfTest(false, 'IDBFS 重启后的存档探针字节不一致。');
        return;
      }
      FS.unlink(idbfsSelfTestPath);
      FS.syncfs(false, function(error) {
        if (error) {
          finishIdbfsSelfTest(false, `IDBFS 测试清理失败：${error}`);
          return;
        }
        sessionStorage.removeItem(idbfsSelfTestSessionKey);
        finishIdbfsSelfTest(true, 'IDBFS 写入、页面重启与字节恢复测试通过。');
      });
    }

    var Module = {
      swd2HeldDirection: 0,
      swd2DirectionQueue: [],
      // Filled by the WASM polling boundary only for the explicit browser
      // input diagnostic. This proves that a real DOM hold crossed into the
      // core rather than merely changing a JavaScript variable.
      swd2InputSelfTestEnabled: inputSelfTestEnabled,
      swd2InputDeliveries: [],
      swd2WorldSamples: [],
      arguments: ['--game', '/game', '--save-dir', '/saves', '--play'],
      canvas,
      preRun: [function() {
        if (!idbfsSelfTestToken) {
          addRunDependency('swd2-user-start');
          startDependencyInstalled = true;
          releaseStartDependency();
        }
        try { FS.mkdir('/saves'); } catch (_) {}
        FS.mount(IDBFS, {}, '/saves');
        addRunDependency('swd2-idbfs');
        FS.syncfs(true, function(error) {
          if (idbfsSelfTestToken) {
            if (error) {
              finishIdbfsSelfTest(false, `IDBFS 初始读取失败：${error}`);
            } else {
              runIdbfsSelfTest();
            }
            // Keep the runtime dependency in test mode so the game cannot
            // mutate the probe or replace the authoritative result message.
            return;
          }
          if (error) errorText.textContent = '读取浏览器存档失败，本次仍可继续游戏。';
          removeRunDependency('swd2-idbfs');
        });
      }],
      print: (...args) => console.log(...args),
      printErr: (...args) => { console.error(...args); errorText.textContent = args.join(' '); },
      setStatus(text) {
        statusText.textContent = text || '正在启动…';
        const match = text && text.match(/\((\d+)\/(\d+)\)/);
        if (match) { progress.max = Number(match[2]); progress.value = Number(match[1]); }
        if (!text) { statusWrap.classList.add('ready'); canvas.focus(); }
      },
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies || 0, left);
        if (left) this.setStatus(`正在载入游戏数据… (${this.totalDependencies - left}/${this.totalDependencies})`);
        else this.setStatus('正在启动游戏…');
      },
      onRuntimeInitialized() {
        statusWrap.classList.add('ready');
        unlockWebAudio();
        canvas.focus();
      },
      onAbort(reason) { errorText.textContent = `启动失败：${reason}`; }
    };

    const keyCodes = {
      Enter: 13, Escape: 27,
      ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40
    };
    const directionCodes = {
      ArrowUp: 1, ArrowLeft: 2, ArrowDown: 3, ArrowRight: 4
    };
    function emitKey(type, key) {
      canvas.focus();
      const event = new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true });
      Object.defineProperties(event, {
        keyCode: { get: () => keyCodes[key] },
        which: { get: () => keyCodes[key] }
      });
      canvas.dispatchEvent(event);
    }
    function pressDirection(key) {
      const direction = directionCodes[key];
      if (!direction) return;
      // Do not re-enter WebAssembly from a DOM callback: the game may be in an
      // ASYNCIFY sleep. SDL polls this plain JS state and repeats the held key.
      if (Module.swd2DirectionQueue.length < 4) {
        Module.swd2DirectionQueue.push(direction);
      }
      Module.swd2HeldDirection = direction;
    }
    function releaseDirection(key) {
      const direction = directionCodes[key];
      if (Module.swd2HeldDirection === direction) {
        Module.swd2HeldDirection = 0;
      }
    }
    const directionKeys = new Set(['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown']);
    const heldControls = new Map();
    function releaseControl(button, event) {
      if (event) event.preventDefault();
      const held = heldControls.get(button);
      if (!held) return;
      heldControls.delete(button);
      if (held.direction) releaseDirection(button.dataset.key);
      else emitKey('keyup', button.dataset.key);
    }
    function pressControl(button, event, source, contactId) {
      event.preventDefault();
      if (heldControls.has(button)) return;
      const direction = directionKeys.has(button.dataset.key);
      heldControls.set(button, { direction, source, contactId });
      if (direction) pressDirection(button.dataset.key);
      else emitKey('keydown', button.dataset.key);
    }
    document.querySelectorAll('[data-key]').forEach(button => {
      button.addEventListener('pointerdown', event => {
        // iOS/WKWebView also emits pointer events for a touch. Ignore those
        // and use the native touch lifetime below: WebKit may cancel pointer
        // capture during a long press even while the finger remains down.
        if (event.pointerType === 'touch') return;
        try { button.setPointerCapture(event.pointerId); } catch (_) {}
        pressControl(button, event, 'pointer', event.pointerId);
      });
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        button.addEventListener(type, event => {
          if (event.pointerType === 'touch') return;
          const held = heldControls.get(button);
          if (held && held.source === 'pointer' &&
              (event.pointerId === undefined || event.pointerId === held.contactId)) {
            releaseControl(button, event);
          }
        });
      }
      button.addEventListener('touchstart', event => {
        const touch = event.changedTouches && event.changedTouches[0];
        if (!touch) return;
        pressControl(button, event, 'touch', touch.identifier);
      }, { passive: false });
      button.addEventListener('touchmove', event => {
        if (heldControls.get(button)?.source === 'touch') event.preventDefault();
      }, { passive: false });
      for (const type of ['touchend', 'touchcancel']) {
        button.addEventListener(type, event => {
          const held = heldControls.get(button);
          if (!held || held.source !== 'touch') return;
          const ended = Array.prototype.some.call(
            event.changedTouches || [],
            touch => touch.identifier === held.contactId);
          if (ended) releaseControl(button, event);
        }, { passive: false });
      }
    });
    window.addEventListener('blur', () => {
      for (const button of [...heldControls.keys()]) releaseControl(button);
    });
    document.addEventListener('swd2-save-sync', event => {
      if (event.detail) errorText.textContent = '浏览器存档写入失败：' + event.detail;
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
